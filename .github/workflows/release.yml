name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create at this commit and release, such as v1.10.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag
        run: |
          [[ "$TAG" == v* ]] || { echo "tag must start with v: $TAG"; exit 1; }

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - name: Test the Codex bridge
        run: python3 -m unittest discover -s tests/codex_bridge

      - name: Package skills
        run: |
          set -euo pipefail
          mkdir -p dist
          cd skills
          for d in */; do
            name="${d%/}"
            zip -r "../dist/${name}.zip" "$name" -x '*.DS_Store' -x '*/__pycache__/*' -x '*.pyc' -x '*Thumbs.db'
          done
          cd ..
          ls -l dist

      - name: List changed skills
        run: python3 scripts/release_notes.py | tee release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A manual run creates the tag at this commit; a tag push already has it.
          # gh puts release-notes.md above the generated notes.
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes
