name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - name: Package skills
        run: |
          set -euo pipefail
          mkdir -p dist
          cd skills
          for d in */; do
            name="${d%/}"
            zip -r "../dist/${name}.zip" "$name" -x '*.DS_Store' -x '*/__pycache__/*' -x '*.pyc' -x '*Thumbs.db'
          done
          cd ..
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
