name: shutdown-when-done on Windows

# Runs the gate's tests and hook on a real Windows VM. Nothing here runs a
# shutdown command: the tests patch out process launching, except the hook
# script itself, and the shell checks below echo arguments through Python.

on:
  pull_request:
    paths:
      - "skills/shutdown-when-done/**"
      - ".github/workflows/shutdown-gate-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pytest
        run: python -m pip install pytest

      - name: Tests (PowerShell)
        shell: pwsh
        run: python -m pytest -v -p no:cacheprovider skills/shutdown-when-done/tests

      - name: Tests (Git Bash, the shell Claude Code's Bash tool uses)
        shell: bash
        run: python -m pytest -q -p no:cacheprovider skills/shutdown-when-done/tests

      - name: How Git Bash passes /s and /a to a Windows program
        shell: bash
        run: |
          echo "without prefix:"
          python -c "import sys; print(sys.argv[1:])" /s /t 600 /a
          echo "with MSYS_NO_PATHCONV=1:"
          out=$(MSYS_NO_PATHCONV=1 python -c "import sys; print(sys.argv[1:])" /s /t 600 /a)
          echo "$out"
          test "$out" = "['/s', '/t', '600', '/a']"

      - name: Validate skills
        run: python scripts/validate_skills.py
